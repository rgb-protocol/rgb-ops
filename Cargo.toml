[workspace]
members = [
    ".",
    "invoice",
]
default-members = [
    ".",
    "invoice"
]
resolver = "2"

[workspace.package]
version = "0.11.1"
authors = ["Zoe Faltibà <zoefaltiba@gmail.com>"]
homepage = "https://rgb.info"
repository = "https://github.com/rgb-protocol/rgb-ops"
keywords = ["bitcoin", "lightning", "rgb", "smart-contracts", "lnp-bp"]
categories = ["cryptography::cryptocurrencies"]
rust-version = "1.85.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
amplify = "=4.8.1"
nonasync = "=0.1.3"
rgb-ascii-armor = "1.0.4"
baid64 = "=0.4.1"
bitcoincore-rpc = "0.19.0"
electrum-client = "0.25.0"
esplora-client = { version = "0.12.1", default-features = false }
rgb-strict-encoding = "1.0.4"
rgb-strict-types = "1.0.4"
rgb-consensus = { version = "0.11.1", features = [
    "stl",
] }
indexmap = "2.14.0"
serde_crate = { package = "serde", version = "1", features = ["derive"] }

[package]
name = "rgb-ops"
version = { workspace = true }
description = "RGB ops library for working with smart contracts on Bitcoin & Lightning"
keywords = { workspace = true }
categories = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
rust-version = { workspace = true }

[lib]
name = "rgbstd"
crate-type = ["cdylib", "rlib"] # We need this for WASM

[dependencies]
amplify = { workspace = true }
rgb-ascii-armor = { workspace = true }
baid64 = { workspace = true }
bitcoincore-rpc = { workspace = true, optional = true }
electrum-client = { workspace = true, optional = true }
esplora-client = { workspace = true, optional = true }
rgb-strict-encoding = { workspace = true }
rgb-strict-types = { workspace = true }
rgb-consensus = { workspace = true }
rgb-invoicing = { version = "0.11.1", path = "invoice" }
rgb-aluvm = "0.11.1"
chrono = "0.4.45"
rand = "0.9.1"
serde_crate = { workspace = true, optional = true }
serde_json = { version = "1", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }

[features]
default = []
all = [
    "esplora_blocking",
    "electrum_blocking",
    "mempool_blocking",
    "bitcoind_blocking",
    "fs",
    "legacy",
    "serde",
    "sqlite",
]
esplora_blocking = [
    "esplora-client",
    "esplora-client/blocking",
    "esplora-client/blocking-https",
]
electrum_blocking = [
    "electrum-client",
]
bitcoind_blocking = [
    "bitcoincore-rpc",
]
mempool_blocking = [
    "esplora_blocking",
]
serde = [
    "serde_crate",
    "serde_json",
    "chrono/serde",
    "rgb-strict-encoding/serde",
    "rgb-strict-types/serde",
    "rgb-consensus/serde",
    "rgb-invoicing/serde"
]
fs = []
legacy = []
sqlite = ["dep:rusqlite"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
rand = { version = "0.9.1", optional = true }
getrandom = { version = "0.3", features = [
    "wasm_js",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.docs.rs]
features = ["all"]

[patch.crates-io]
rgb-strict-encoding = { git = "https://github.com/rgb-protocol/rgb-strict-encoding", rev = "1598d8c" }
rgb-ascii-armor = { git = "https://github.com/rgb-protocol/rgb-ascii-armor", rev = "a9bd205" }
rgb-strict-types = { git = "https://github.com/rgb-protocol/rgb-strict-types", rev = "2f9d542" }
rgb-aluvm = { git = "https://github.com/rgb-protocol/rgb-aluvm", rev = "53b2809" }
rgb-consensus = { git = "https://github.com/rgb-protocol/rgb-consensus", rev = "e511258a"}
